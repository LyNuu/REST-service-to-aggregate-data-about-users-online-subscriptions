services:
  db:
    image: postgres:15
    container_name: subscription_db
    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_DB : ${POSTGRES_DB}
      POSTGRES_USER : ${POSTGRES_USER}
      POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}

    volumes:
      - pg_data:/var/lib/postgres/data

volumes:
  pg_data: